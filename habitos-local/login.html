<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080d18">
  <title>Entrar — Hábitos</title>
  <link rel="stylesheet" href="styles.css?v=20260907-4">
  <style>
    body{min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 20% 10%,rgba(0,135,255,.16),transparent 35%),radial-gradient(circle at 90% 90%,rgba(118,40,216,.15),transparent 35%),#080d18;padding:24px 0}.auth-shell{width:min(430px,calc(100% - 32px));margin:auto}.auth-brand{text-align:center;margin-bottom:28px}.auth-mark{width:58px;height:58px;margin:0 auto 14px;border-radius:18px;display:grid;place-items:center;font-size:28px;font-weight:900;background:linear-gradient(135deg,#0087FF,#7628D8);color:#fff;box-shadow:0 16px 40px rgba(0,135,255,.22)}.auth-brand h1{margin:0;font-size:30px}.auth-brand p{margin:8px 0 0;color:#8f9bb0}.auth-card{padding:28px;border:1px solid rgba(143,155,176,.16);border-radius:22px;background:rgba(18,26,42,.92);box-shadow:0 24px 70px rgba(0,0,0,.35);backdrop-filter:blur(14px)}.auth-card h2{margin:0 0 6px}.auth-card .sub{display:block;color:#8f9bb0;margin-bottom:22px}.auth-field{display:block;margin:15px 0}.auth-field span{display:block;margin-bottom:7px;font-size:13px;color:#aeb8c9}.auth-field input{width:100%;box-sizing:border-box;padding:13px 14px;border-radius:12px;border:1px solid #2a3850;background:#0d1524;color:#fff;outline:none}.auth-field input:focus{border-color:#0087FF;box-shadow:0 0 0 3px rgba(0,135,255,.12)}.auth-primary{width:100%;margin-top:7px;padding:13px;border:0;border-radius:12px;background:linear-gradient(90deg,#0087FF,#7628D8);color:#fff;font-weight:800;cursor:pointer}.auth-primary:disabled,.auth-secondary:disabled,.google-btn:disabled{opacity:.6;cursor:wait}.auth-secondary,.google-btn{width:100%;padding:12px;border:1px solid #33415b;border-radius:12px;background:transparent;color:#fff;font-weight:700;cursor:pointer}.auth-secondary{margin-top:10px}.google-btn{margin-top:10px;background:#fff;color:#202124;border-color:#fff;display:flex;align-items:center;justify-content:center;gap:10px}.google-icon{width:18px;height:18px;font-weight:900;font-size:17px}.divider{display:flex;align-items:center;gap:10px;color:#68758a;font-size:11px;margin:17px 0}.divider:before,.divider:after{content:"";height:1px;background:#2a3850;flex:1}.auth-links{display:flex;justify-content:center;margin-top:15px}.auth-link{border:0;background:none;color:#66b5ff;cursor:pointer}.auth-error{min-height:20px;margin-top:15px;text-align:center;color:#ff7d96;font-size:13px;line-height:1.45}.auth-success{color:#62d6ad}.auth-foot{text-align:center;color:#68758a;font-size:12px;margin-top:18px}.signup-extra{display:none}.auth-title-signup{display:none}.mode-signup .auth-title-login,.mode-signup .auth-login-sub,.mode-signup .login-only,.mode-signup .auth-google-divider,.mode-signup #googleBtn,.mode-signup .google-help,.mode-signup #signupBtn{display:none}.mode-signup .auth-title-signup,.mode-signup .signup-extra,.mode-signup #backLogin{display:block}.back-login{display:none}.google-help{font-size:10px;color:#68758a;text-align:center;margin-top:8px}@media(max-width:480px){body{padding:18px 0}.auth-shell{width:min(430px,calc(100% - 22px))}.auth-card{padding:22px;border-radius:18px}.auth-brand{margin-bottom:20px}.auth-brand h1{font-size:27px}.auth-mark{width:52px;height:52px;font-size:25px}}
  </style>
</head>
<body>
  <main class="auth-shell">
    <div class="auth-brand"><div class="auth-mark">H</div><h1>Hábitos</h1><p>Seu sistema pessoal gamificado</p></div>
    <section class="auth-card" id="authCard">
      <h2 class="auth-title-login">Bem-vindo de volta</h2><h2 class="auth-title-signup">Criar sua conta</h2>
      <span class="sub auth-login-sub">Entre para continuar sua evolução.</span><span class="sub signup-extra">Crie sua conta para salvar seu progresso na nuvem.</span>
      <form id="loginForm">
        <label class="auth-field signup-extra"><span>Nome de usuário</span><input id="displayName" type="text" autocomplete="name" placeholder="Como você quer ser chamado?"></label>
        <label class="auth-field"><span>E-mail</span><input id="email" type="email" autocomplete="email" placeholder="seu@email.com" required></label>
        <label class="auth-field"><span>Senha</span><input id="password" type="password" autocomplete="current-password" placeholder="Sua senha" minlength="6" required></label>
        <button id="submitBtn" class="auth-primary" type="submit">Entrar</button>
      </form>
      <div class="divider auth-google-divider"><span>ou</span></div>
      <button id="googleBtn" class="google-btn" type="button"><span class="google-icon">G</span> Continuar com Google</button>
      <div class="google-help">No primeiro acesso, sua conta será criada automaticamente.</div>
      <button id="signupBtn" class="auth-secondary" type="button">Criar minha conta</button>
      <button id="backLogin" class="auth-secondary back-login" type="button">Voltar para entrar</button>
      <div class="auth-links login-only"><button id="forgotBtn" class="auth-link" type="button">Esqueci minha senha</button></div>
      <div id="authError" class="auth-error"></div>
    </section>
    <div class="auth-foot">Seus hábitos e progresso serão sincronizados na nuvem.</div>
  </main>
  <script src="https://www.gstatic.com/firebasejs/11.0.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/11.0.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js?v=20260907-4"></script>
  <script src="auth.js?v=20260907-7"></script>
</body>
</html>
